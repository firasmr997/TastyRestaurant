# Tasty: PostgreSQL + Spring Boot API (+ optional Nginx-served frontend).
#
#   docker compose up -d                      # database + API (dev profile, demo data)
#   docker compose --profile web up -d        # ...plus the production frontend build on :8081
#
# Values come from .env (see .env.example). Defaults are development-only.
name: tasty

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasty}
      POSTGRES_USER: ${POSTGRES_USER:-tasty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasty}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tasty}
      DATABASE_USERNAME: ${POSTGRES_USER:-tasty}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-tasty}
      # Development default only: the prod profile refuses any secret containing "dev-only".
      JWT_SECRET: ${JWT_SECRET:-dev-only-docker-compose-secret-0123456789abcdefghij}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-12h}
      UPLOAD_DIRECTORY: /app/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-/uploads}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    profiles: ["web"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  postgres-data:
  uploads:
