# Serves the built SPA and proxies the API and uploaded images to the backend container,
# so the browser talks to a single origin (no CORS needed in this setup).
# TLS terminates in front of this container (load balancer or reverse proxy); add
# Strict-Transport-Security there.

# Keep the scheme a TLS-terminating proxy in front of this container already reported.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API and uploaded images. The backend rebuilds the public URL from the X-Forwarded-* headers;
  # $http_host keeps the public port, so requests from the SPA stay same-origin (not CORS).
  location ~ ^/(api|uploads)/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Fingerprinted build assets: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/menu, /fr/about, /admin/...) fall back to the SPA shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
