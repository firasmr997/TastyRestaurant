# Security headers for what nginx serves itself (the SPA shell, build assets, public files).
# Included per location: a location that sets its own add_header stops inheriting the server's.
# The API and /uploads responses carry the Spring Boot backend's own security headers.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The SPA calls the API on this origin (/api). Dish and gallery photos may come from any HTTPS host.
# Inline styles are allowed because the animation libraries write style attributes and a small style tag.
# If VITE_API_URL points at another origin, add that origin to connect-src and img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
