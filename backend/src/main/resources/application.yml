# Shared configuration. Profile-specific overrides live in application-dev.yml and application-prod.yml.
spring:
  application:
    name: tasty-api
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tasty}
    username: ${DATABASE_USERNAME:tasty}
    password: ${DATABASE_PASSWORD:tasty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:8MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}
  web:
    # API messages (including validation errors) are always English; the frontends localise their own copy.
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

tasty:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:12h}
    issuer: tasty-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    upload-directory: ${UPLOAD_DIRECTORY:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:8MB}
  admin:
    # Optional bootstrap admin, created at startup when no account with this email exists.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Tasty Admin}
  rate-limit:
    login-attempts: 10
    login-window: 15m
    contact-submissions: 5
    contact-window: 10m
