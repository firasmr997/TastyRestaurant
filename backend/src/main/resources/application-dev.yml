# Development profile: demo seed data, local image storage, verbose logging.
spring:
  flyway:
    # db/demo adds V7_1__insert_demo_data.sql (demo menu, gallery, settings and the dev admin).
    locations: classpath:db/migration,classpath:db/demo

tasty:
  jwt:
    # Development-only fallback. Production refuses to start without a real JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-tasty-jwt-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

logging:
  level:
    com.tasty: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
